services:
  app:
    image: ${APP_IMAGE:-apollo-app}
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        RELEASE_ID: ${RELEASE_ID:-unknown}
    container_name: stock-tracker-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgresql://stock_user:stock_pass@postgres:5432/stock_tracker
      ANALYTICS_BACKEND: ${ANALYTICS_BACKEND:-rust}
      WSGI_WORKERS: ${WSGI_WORKERS:-2}
      WSGI_THREADS: ${WSGI_THREADS:-2}
      WSGI_TIMEOUT: ${WSGI_TIMEOUT:-120}
      WSGI_GRACEFUL_TIMEOUT: ${WSGI_GRACEFUL_TIMEOUT:-120}
      WSGI_INIT_DB: ${WSGI_INIT_DB:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
    stop_grace_period: ${WSGI_STOP_GRACE_PERIOD:-130s}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health/analytics', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: stock-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_tracker
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
